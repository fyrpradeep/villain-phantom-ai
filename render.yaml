services:
  - type: web
    name: villain-phantom-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Optional: Fill these in Render dashboard for live trading
      # - key: ANGEL_API_KEY
      #   value: your_key_here
      # - key: ANGEL_CLIENT_ID
      #   value: your_client_id
      # - key: ANGEL_PASSWORD
      #   value: your_password
      # - key: ANGEL_TOTP_SECRET
      #   value: your_totp_secret
